apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: innova
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: root-password
            - name: MYSQL_DATABASE
              value: ecommercedb
            - name: MYSQL_USER
              value: db_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: db-password
          ports:
            - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-db
  namespace: innova
spec:
  type: ClusterIP
  selector:
    app: mysql-db
  ports:
    - port: 3306