apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-despachos
  namespace: innova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-despachos
  template:
    metadata:
      labels:
        app: ms-despachos
    spec:
      containers:
        - name: ms-despachos
          image: 506146271399.dkr.ecr.us-east-1.amazonaws.com/innova-ms-despachos:latest
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-db:3306/ecommercedb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true"
            - name: DB_USERNAME
              value: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: db-password
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ms-despachos
  namespace: innova
spec:
  type: ClusterIP
  selector:
    app: ms-despachos
  ports:
    - port: 8080